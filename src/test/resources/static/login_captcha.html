<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Đăng nhập hệ thống (QA CAPTCHA Mode)</title>
  <style>
    .error { color: red; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <h2>Đăng nhập hệ thống</h2>
  <form id="login-form" onsubmit="return handleLogin(event)">
    <div>
      <label>Tài khoản:</label>
      <input type="text" id="username" name="username" />
    </div>
    <div>
      <label>Mật khẩu:</label>
      <input type="password" id="password" name="password" />
    </div>
    <div id="captcha-container">
      <label>Mã bảo vệ:</label>
      <span id="captcha-code" style="font-weight:bold; letter-spacing: 2px;">QA88</span>
      <input type="text" id="captcha-input" name="captcha" placeholder="Nhập mã bảo vệ" />
    </div>
    <div id="error-message" class="error"></div>
    <button type="submit" id="btn-submit">Đăng nhập</button>
  </form>

  <script>
    const VALID_CAPTCHA = "QA88";

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const c = document.getElementById('captcha-input').value.trim();
      const err = document.getElementById('error-message');

      if (!c) {
        err.innerText = "Vui lòng nhập mã bảo vệ (CAPTCHA)";
        return false;
      }
      if (c !== VALID_CAPTCHA) {
        err.innerText = "Mã bảo vệ (CAPTCHA) không chính xác";
        return false;
      }
      err.innerText = "Tên đăng nhập hoặc mật khẩu không chính xác";
      return false;
    }
  </script>
</body>
</html>
